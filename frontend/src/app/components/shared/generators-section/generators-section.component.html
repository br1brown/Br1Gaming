<h1 class="h4 fw-bold mb-3 section-heading-scrim">{{ 'generatori' | translate }}</h1>

<!-- Call-to-action verso i Piaciuti in cima: sono la scorciatoia più usata, non un "in fondo alla
     lista" che nessuno raggiunge. Compatta, una riga. -->
@if (showPiaciutiCta()) {
<a class="card border-0 bg-body-tertiary rounded-4 mb-3 text-decoration-none lift-on-hover" [appPage]="PageType.Piaciuti">
    <div class="card-body d-flex align-items-center gap-3 py-3 px-4">
        <i class="fa-solid fa-heart text-danger fs-4 flex-shrink-0" aria-hidden="true"></i>
        <div class="flex-grow-1">
            <h2 class="h6 fw-bold mb-0">{{ 'condivisi' | translate }}</h2>
            <p class="text-body-secondary small mb-0">{{ 'condivisiSottotitolo' | translate }}</p>
        </div>
        <i class="fa-solid fa-chevron-right text-body-secondary flex-shrink-0" aria-hidden="true"></i>
    </div>
</a>
}

@if (loading()) {
<!-- Scheletro durante il caricamento: evita il flash del messaggio "vuoto" prima che l'elenco arrivi. -->
<div class="row g-3 placeholder-glow" aria-hidden="true">
    @for (n of skeletonSlots; track n) {
    <div [class]="itemColClass()">
        <div class="card" style="min-height: 9rem">
            <div class="card-body">
                <span class="placeholder col-7 mb-2 d-block"></span>
                <span class="placeholder col-10 d-block"></span>
            </div>
        </div>
    </div>
    }
</div>
} @else {
@if (cards().length === 0) {
<app-empty-state titleKey="hubNessunGeneratore" icon="fa-solid fa-dice" />
}
<app-card-grid [items]="cards()" [itemColClass]="itemColClass()" />
}
