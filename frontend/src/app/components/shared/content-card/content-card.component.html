<!-- Copertina fotografica + scrim, stesso trattamento delle card storia in home (dilemma-section):
     un solo linguaggio visivo per tutte le card di contenuto del sito, non più una riga di lista
     con miniatura piccola. Tutta la card è il link, la freccia in basso a destra segnala "entra". -->
<a class="card content-card-cover overflow-hidden h-100 text-decoration-none"
   [class.has-image]="imageId() && imageVisible()"
   [routerLink]="path()">
    @if (imageId() && imageVisible()) {
    <img [appAsset]="imageId()!"
         [appAssetSizes]="'(min-width: 768px) 33vw, 50vw'"
         [alt]="title()"
         class="content-card-bg"
         loading="lazy"
         (error)="onImageError()">
    <span class="content-card-scrim" aria-hidden="true"></span>
    }
    <h3 class="content-card-title h6 mb-1">{{ title() }}</h3>
    @if (subtitle()) {
    <p class="content-card-desc small mb-0">{{ subtitle() }}</p>
    }
    <i class="fa-solid fa-chevron-right content-card-arrow" aria-hidden="true"></i>
</a>
