<div class="rw">
    <div class="rw-scope" aria-hidden="true">
        <div class="rw-ring rw-ring-1"></div>
        <div class="rw-ring rw-ring-2"></div>
        <div class="rw-ring rw-ring-3"></div>
        <div class="rw-crosshair rw-crosshair-h"></div>
        <div class="rw-crosshair rw-crosshair-v"></div>
        <div class="rw-sweep"></div>
        @for (blip of blips; track blip.top) {
        <span class="rw-blip" [style.top]="blip.top" [style.left]="blip.left" [style.animation-delay]="blip.delay">⛪</span>
        }
        <span class="rw-center"></span>
    </div>

    <div class="rw-readout">
        <h2 class="h6 fw-bold mb-1">{{ 'radar' | translate }}</h2>
        <p class="small mb-2">{{ 'radarWidgetSottotitolo' | translate }}</p>
        <a class="btn-skeuo btn-skeuo-phosphor rw-cta" [appPage]="PageType.UtilityRadar">
            <i class="fa-solid fa-satellite-dish" aria-hidden="true"></i>
            {{ 'radarWidgetApri' | translate }}
        </a>
    </div>
</div>
