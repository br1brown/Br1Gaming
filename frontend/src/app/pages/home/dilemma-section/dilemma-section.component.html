<h2 class="h4 fw-bold mb-3 section-heading-scrim">{{ 'storie' | translate }}</h2>

<div class="dilemma-grid">

    @if (loading()) {
    @for (n of skeletonSlots; track n) {
    <div class="dilemma-card placeholder-glow" aria-hidden="true">
        <span class="placeholder col-7 mb-2 d-block"></span>
        <span class="placeholder col-10 d-block"></span>
    </div>
    }
    } @else {
    @for (s of stories(); track s.slug) {
    <a class="dilemma-card" [class.has-image]="!brokenImages().has(s.slug)"
       [appPage]="storyPageType" [appPageParams]="{ slug: s.slug }">
        @if (!brokenImages().has(s.slug)) {
        <img [appAsset]="s.imageId"
             [appAssetSizes]="'(min-width: 768px) 33vw, 50vw'"
             alt=""
             class="dilemma-card-bg"
             loading="lazy"
             (error)="onImageError(s.slug)">
        <span class="dilemma-card-scrim" aria-hidden="true"></span>
        }
        <h3 class="dilemma-title">{{ s.title }}</h3>
        @if (s.description) {
        <p class="dilemma-desc">{{ s.description }}</p>
        }
        <i class="fa-solid fa-chevron-right dilemma-arrow" aria-hidden="true"></i>
    </a>
    }
    }

</div>
