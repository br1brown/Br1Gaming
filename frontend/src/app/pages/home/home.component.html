<!-- ════════════════════════════════════════════════════ HERO -->
<section class="pb-5 border-bottom mb-5">
    <div class="row g-4 align-items-center">

        <div class="col-lg-8">
            <h1 class="display-6 fw-bold mb-2">{{ appName }}</h1>
            <p class="lead text-muted mb-3">{{ 'heroTagline' | translate }}</p>
            <div class="d-flex flex-wrap gap-2">
                <span class="badge text-bg-primary">Angular 21</span>
                <span class="badge text-bg-secondary">Signals</span>
                <span class="badge text-bg-secondary">SSR</span>
                <span class="badge text-bg-secondary">PWA</span>
                <span class="badge text-bg-secondary">Bootstrap 5</span>
                <span class="badge text-bg-success">WCAG AA</span>
                <span class="badge text-bg-secondary">i18n</span>
                <span class="badge text-bg-secondary">TypeScript</span>
            </div>
        </div>

        <!-- Numeri visibili a ogni larghezza, non solo da lg: sotto si dispongono in riga (4 affiancati
             da sm, 2×2 sul telefono), accanto al titolo quando c'è posto. -->
        <div class="col-lg-4">
            <div class="row row-cols-2 row-cols-sm-4 row-cols-lg-2 g-3">
                @for (stat of heroStats; track stat.label) {
                    <div class="col">
                        <div class="border border-primary-subtle rounded p-3 text-center bg-primary-subtle h-100 d-flex flex-column align-items-center justify-content-center gap-1">
                            <span class="fs-2 fw-bold text-primary-emphasis lh-1">{{ stat.value }}</span>
                            <span class="small text-uppercase text-primary-emphasis">{{ stat.label | translate }}</span>
                        </div>
                    </div>
                }
            </div>
        </div>

    </div>
</section>
