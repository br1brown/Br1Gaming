<main class="col-12 col-md-10 offset-md-1 col-lg-10 offset-lg-1">

    <!-- Hero: solo la firma del sito, minima — il tono lo dà subito sotto la griglia, non un
         muro di testo introduttivo (BR1-UI §1). -->
    <section class="text-center mb-4">
        <h1 class="display-6 fw-bold mb-1 section-heading-scrim d-inline-block">{{ appName }}</h1>
        <p class="lead text-secondary mb-0 small">{{ 'homeTagline' | translate }}</p>
    </section>

    <!-- Bento Grid: CSS Grid nativo, asimmetrico da desktop, colonna singola su mobile
         (BR1-DEV §1 "Layout Engine"). -->
    <div class="bento">

        <!-- A. I Pesi Massimi: idratato subito, è il blocco dominante above-the-fold. -->
        <section class="bento-cell bento-simulators">
            <app-simulators-hero />
        </section>

        <!-- B. Hub Generatori (7 in 1) + C. Micro-tool istantanei: stessa riga da desktop. -->
        <section class="bento-cell bento-hub">
            @defer (hydrate on viewport) {
            <app-generator-hub />
            } @placeholder {
            <div class="bento-skeleton placeholder-glow" aria-hidden="true">
                <span class="placeholder col-9 mb-2 d-block" style="height: 1.5rem"></span>
                <span class="placeholder col-12 d-block" style="height: 8rem"></span>
            </div>
            }
        </section>

        <section class="bento-cell bento-tools">
            @defer (hydrate on viewport) {
            <app-translator-widget />
            } @placeholder {
            <div class="bento-skeleton placeholder-glow" aria-hidden="true">
                <span class="placeholder col-12 d-block" style="height: 6rem"></span>
            </div>
            }
            @defer (hydrate on viewport) {
            <app-radar-widget />
            } @placeholder {
            <div class="bento-skeleton placeholder-glow" aria-hidden="true">
                <span class="placeholder col-12 d-block" style="height: 6rem"></span>
            </div>
            }
        </section>

        <!-- D. Innesco Narrativo: dilemma immediato, niente spiegazioni. -->
        <section class="bento-cell bento-dilemma">
            @defer (hydrate on viewport) {
            <app-dilemma-section />
            } @placeholder {
            <div class="bento-skeleton placeholder-glow" aria-hidden="true">
                <span class="placeholder col-9 mb-2 d-block" style="height: 1.5rem"></span>
                <span class="placeholder col-12 d-block" style="height: 5rem"></span>
            </div>
            }
        </section>

    </div>
</main>
