<div class="sim-grid">
    @for (tile of tiles; track tile.slug) {
    <a class="sim-tile lift-on-hover" [class.sim-tile--flat]="!tile.imageId" [appPage]="tile.pageType">
        @if (tile.imageId) {
        <img [appAsset]="tile.imageId"
             [appAssetSizes]="'(min-width: 992px) 33vw, 100vw'"
             alt=""
             class="sim-tile-bg"
             loading="lazy">
        <span class="sim-tile-scrim" aria-hidden="true"></span>
        } @else if (tile.art === 'robot') {
        <!-- Niente cover fotografica (non è un "gioco"): un robottino SVG che "genera" — antenna che
             pulsa, occhi, pannello con qualche riga di testo. Solo bianchi/trasparenze e il colore
             del testo, quindi segue il gradiente del brand del tile senza colori inventati. -->
        <svg class="sim-tile-robot" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
            <line x1="60" y1="10" x2="60" y2="24" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
            <circle class="sim-tile-robot-led" cx="60" cy="8" r="5" fill="currentColor" />
            <rect x="24" y="24" width="72" height="56" rx="16" fill="rgba(255,255,255,.16)" stroke="currentColor" stroke-width="4" />
            <circle cx="46" cy="46" r="8" fill="currentColor" />
            <circle cx="74" cy="46" r="8" fill="currentColor" />
            <circle cx="48" cy="44" r="2.5" fill="rgba(0,0,0,.45)" />
            <circle cx="76" cy="44" r="2.5" fill="rgba(0,0,0,.45)" />
            <path d="M46 63 q14 10 28 0" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
            <rect x="14" y="40" width="8" height="20" rx="4" fill="currentColor" />
            <rect x="98" y="40" width="8" height="20" rx="4" fill="currentColor" />
            <rect x="34" y="86" width="52" height="26" rx="8" fill="rgba(255,255,255,.16)" stroke="currentColor" stroke-width="4" />
            <line x1="44" y1="95" x2="76" y2="95" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            <line x1="44" y1="103" x2="66" y2="103" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        </svg>
        }
        <div class="sim-tile-body">
            <h2 class="sim-tile-title">{{ tile.titleKey | translate }}</h2>
            <!-- taglineKey assente per Generatori: il numero di generatori cambia, meglio non
                 doverlo tenere sincronizzato in un testo statico qui. -->
            @if (tile.taglineKey) {
            <p class="sim-tile-tagline">{{ tile.taglineKey | translate }}</p>
            }
            <span class="btn-skeuo sim-tile-cta">
                <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>
                {{ tile.ctaKey | translate }}
            </span>
        </div>
    </a>
    }
</div>
