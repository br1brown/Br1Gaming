<div class="text-center error-shell">
    <p class="error-kicker">System glitch</p>
    <h1 class="h2">{{ errorInfo() }}</h1>
    <p>{{ errorMessage() }}</p>
    <div class="d-flex flex-wrap justify-content-center gap-2">
        @if (canRetry()) {
        <!-- Rete, server o backend: l'azione utile è ritentare; la home ha bisogno del backend quanto la pagina fallita. -->
        <button type="button" class="btn btn-primary btn-lg" (click)="riprova()">
            {{ 'riprovaAzione' | translate }}
        </button>
        }
        @if (homePage != null) {
        <a [appPage]="homePage" class="btn btn-lg" [class.btn-primary]="!canRetry()" [class.btn-outline-secondary]="canRetry()">
            {{ 'tornaHomeAzione' | translate }}
        </a>
        } @else {
        <!-- Niente home: navigazione browser "tradizionale" alla radice, fuori dal router. -->
        <a href="/" class="btn btn-lg" [class.btn-primary]="!canRetry()" [class.btn-outline-secondary]="canRetry()">
            {{ 'tornaHomeAzione' | translate }}
        </a>
        }
    </div>
</div>
