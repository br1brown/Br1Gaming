<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="text-start" autocomplete="on" novalidate>

    <input type="text"
           class="d-none"
           formControlName="username"
           autocomplete="username"
           tabindex="-1"
           aria-hidden="true" />

    <div class="form-floating mb-3">
        <input id="login-password"
               type="password"
               class="form-control"
               formControlName="password"
               autocomplete="current-password"
               placeholder="Password"
               required
               appFieldError="login-password-error" />
        <label for="login-password">{{ 'loginPasswordLabel' | translate }}</label>

        @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
        <div id="login-password-error" class="invalid-feedback">
            <i class="fa-solid fa-circle-exclamation me-1" aria-hidden="true"></i>
            {{ (loginForm.controls.password.hasError('required') ? 'loginPasswordObbligatoria' : 'loginPasswordMinLength') | translate }}
        </div>
        }
    </div>

    @if (errorMessage(); as msg) {
    <div class="alert alert-danger py-2 px-3 small d-flex align-items-center gap-2" role="alert">
        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
        <span>{{ msg }}</span>
    </div>
    }

    <!-- CTA del form: taglia normale + .btn-touch (altezza dal target di tocco), come ogni CTA del
         sistema. Mai disabilitato perché il form è invalido: il click mostra gli errori. -->
    <button type="submit"
            class="btn btn-primary btn-touch w-100 mt-2"
            [disabled]="isLoading()"
            [attr.aria-busy]="isLoading() || null">
        <app-busy-icon [busy]="isLoading()" />
        {{ (isLoading() ? 'loginCaricamento' : 'loginAzione') | translate }}
    </button>
</form>
