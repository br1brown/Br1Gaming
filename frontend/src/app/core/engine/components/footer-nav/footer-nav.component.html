@if (links().length > 0) {
    <nav [attr.aria-label]="'footerNav' | translate">
    @if (groups().length > 0) {
        <div class="footer-nav-groups mb-3">
            @for (group of groups(); track group.path) {
                <app-footer-nav-group [group]="group" [level]="0" />
            }
        </div>
    }
    @if (standaloneLinks().length > 0) {
        <div class="row mb-3">
            <div class="col-12">
                <app-footer-link-row [links]="standaloneLinks()" />
            </div>
        </div>
    }
    <hr />
    </nav>
}
