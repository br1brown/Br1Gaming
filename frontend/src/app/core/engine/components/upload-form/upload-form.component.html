<div class="text-start">

    <label class="d-block border rounded-3 p-4 text-center mb-3 cursor-pointer"
           [class.border-primary]="isDragging()"
           [class.bg-primary-subtle]="isDragging()"
           (dragover)="onDragOver($event)"
           (dragleave)="onDragLeave($event)"
           (drop)="onDrop($event)">

        <input type="file"
               class="d-none"
               [accept]="acceptAttr()"
               [multiple]="multiple()"
               [disabled]="isLoading()"
               (change)="onFileSelected($event)" />

        @if (selectedFiles(); as files) {
            @if (files.length === 1) {
                <i class="fa-solid fa-file-circle-check text-primary mb-2 d-block fs-4" aria-hidden="true"></i>
                <span class="small text-body-secondary">{{ fileChosenLabel() }}</span>
                <span class="d-block fw-semibold text-truncate">{{ files[0].name }}</span>
            } @else if (files.length > 1) {
                <i class="fa-solid fa-file-circle-check text-primary mb-2 d-block fs-4" aria-hidden="true"></i>
                <span class="d-block fw-semibold">{{ multipleChosenLabel() }}</span>
            } @else {
                <i class="fa-solid fa-cloud-arrow-up text-body-tertiary mb-2 d-block fs-4" aria-hidden="true"></i>
                <span class="small text-body-secondary">{{ dropzoneText() }}</span>
            }
        }
    </label>

    @if (externalError() || errorMessage(); as msg) {
        <div class="alert alert-danger py-2 px-3 small d-flex align-items-center gap-2 mb-3" role="alert">
            <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
            <span>{{ msg }}</span>
        </div>
    }

    <button type="button"
            class="btn btn-primary w-100 py-2"
            [disabled]="isLoading()"
            (click)="onSubmit()">
        @if (isLoading()) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        }
        {{ isLoading() ? uploadingLabel() : submitLabel() }}
    </button>

</div>
