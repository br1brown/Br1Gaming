@if (isVisible()) {
  <button type="button"
          class="back-to-top surface-elevated fab rounded-circle d-flex align-items-center justify-content-center"
          (click)="scrollToTop()"
          [attr.aria-label]="'tornaInCimaNav' | translate">
    <i class="fa-solid fa-chevron-up icon-md" aria-hidden="true"></i>
  </button>
}
