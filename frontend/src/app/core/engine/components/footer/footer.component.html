<!-- Solo utility di Bootstrap. Il distacco dal contenuto lo dà <main>; colonne sulla linea del contenuto (.shell-line).
     Link del progetto, poi una barra (copyright | mappa e pagine legali, in colonna sotto md) e la descrizione.
     Il fondo è la corsia dei pulsanti fissi («torna su», cookie): padding-bottom di .site-footer in _footer.scss. -->
<footer class="theme-bg site-footer">
    <div class="shell-line pt-4 pb-2">
        <app-footer-nav [links]="footerNavLinks()" />

        <div class="d-flex flex-column flex-md-row justify-content-md-between align-items-center gap-2 small text-center text-md-start">
            <p class="mb-0" [innerHTML]="footerCopyright() | markdownLite"></p>
            @if (legalFooterLinks().length > 0) {
                <app-footer-link-row [links]="legalFooterLinks()" align="end" />
            }
        </div>
        @if (description()) {
            <p class="mt-2 mb-0 small fst-italic text-center text-md-start">{{ description() }}</p>
        }
    </div>
</footer>
