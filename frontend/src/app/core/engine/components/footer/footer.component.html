<!-- Nessun margine sopra: il distacco dal contenuto lo dà <main> (_layout.scss). Colonne sulla linea
     del contenuto (.shell-line), non sulla griglia a scatti di .container. -->
<footer class="theme-bg site-footer">
    <div class="shell-line py-5">
        <app-footer-nav [links]="footerNavLinks()" />

        @if (legalFooterLinks().length > 0) {
            <div class="row pb-3">
                <div class="col">
                    <app-footer-link-row [links]="legalFooterLinks()" />
                </div>
            </div>
            <hr />
        }

        <div class="row pt-3">
            <div class="col text-center footer-fineprint">
                <p class="mb-1" [innerHTML]="footerCopyright() | markdownLite"></p>
                @if (description()) {
                <p class="italic">{{ description() }}</p>
                }
            </div>
        </div>

    </div>
</footer>
