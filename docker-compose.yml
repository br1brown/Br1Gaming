# =============================================================================
# Docker Compose - Frontend SSR Node + Backend (.NET) come servizi separati.
#
# Pubblicazione: usa ./scripts/deploy.sh (legge global-settings.json e orchestra build + up).
#
# PROD (stesso host):
#   docker compose -f docker-compose.yml up -d --build
#
# PROD (backend esposto sull'host, es. API pubbliche o deploy separato):
#   docker compose -f docker-compose.yml -f docker-compose.backend-exposed.yml up -d --build
#
# Sviluppo locale: si usa lo script del frontend (Angular dev server) + Visual Studio
# per il backend, non Docker.
#
# La configurazione proviene da global-settings.json, montato in entrambi i container.
# Frontend e backend leggono direttamente il file JSON alla loro avvio.
# scripts/deploy.sh legge global-settings.json per le poche variabili necessarie a docker-compose
# (porta host, project name) e le passa come variabili d'ambiente inline.
# =============================================================================

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-}"
        BR1_PROJECT_JSON: "${BR1_PROJECT_JSON:-}"
    environment:
      BACKEND_ORIGIN: "http://backend:8080"
      GLOBAL_SETTINGS_PATH: /app/global-settings.json
      SECURITY_HEADERS_PATH: /app/security-headers.json
      # Letta a runtime da canonical/hreflang/sitemap.xml (server-env.ts), non dal bundle. Senza
      # impostarla, ricade da sola su `https://<frontend.hostname>`.
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-}"
      # Passthrough OPZIONALE: se NON imposti la variabile nell'ambiente, resta vuota = sito
      # indicizzabile (default di produzione). Per una copia di staging che NON deve finire su
      # Google:  export SEO_NOINDEX=true; ./scripts/deploy.sh
      SEO_NOINDEX: "${SEO_NOINDEX:-}"
    ports:
      - "${FRONTEND_PORT:?ERRORE: impostare frontend.port in global-settings.json}:3000"
    volumes:
      - ${BR1_SETTINGS_FILE:-./global-settings.json}:/app/global-settings.json:ro
      - ./security-headers.json:/app/security-headers.json:ro
      # Font custom opzionale: se ./fonts contiene un file font (woff2/woff/ttf/otf), diventa il
      # font di default del sito (vedi custom-font-detect.ts). Cartella assente/vuota = nessun
      # cambiamento — Docker la crea vuota da sola se BR1_FONTS_DIR non esiste sull'host.
      - ${BR1_FONTS_DIR:-./fonts}:/app/fonts:ro
    depends_on:
      backend:
        condition: service_healthy
        required: false
    # Hardening: nessun nuovo privilegio + zero capability Linux. Sicuro qui perché il
    # container gira già come utente non-root (vedi Dockerfile) e ascolta su porta > 1024.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Indirizzo interno del frontend (FrontendOptions.Origin), per invalidare la cache sitemap
      # dopo una scrittura che cambia un catalogo dietro dynamicParams. Sempre vero in questa
      # topologia — non un passthrough opzionale come Mail__Password sotto.
      - Frontend__Origin=http://frontend:3000
      # Passaggio OPZIONALE di segreti via variabile d'ambiente (precedenza sul JSON montato).
      # Senza valore = "passthrough": il valore arriva dall'ambiente di chi lancia il deploy; se la
      # variabile non è impostata non viene passata e resta il valore del JSON. Esempio per tenere
      # la password SMTP fuori dal file su disco:  export Mail__Password='...'; ./scripts/deploy.sh
      - Mail__Password
    volumes:
      - ${BR1_SETTINGS_FILE:-./global-settings.json}:/app/global-settings.json:ro
      - ./security-headers.json:/app/security-headers.json:ro
      - uploads-data:/app/uploads
      - db-data:/app/db
    # Hardening: nessun nuovo privilegio + zero capability Linux. Sicuro qui perché il
    # container gira già come utente non-root (vedi Dockerfile) e ascolta su porta > 1024.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  uploads-data:
    driver: local
  db-data:
    driver: local
