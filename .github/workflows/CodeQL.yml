name: CodeQL

# Analisi statica di sicurezza (SAST) via CodeQL per frontend e backend.

on:
  # `branches:` qui è statico (non legge il branch di default a runtime): il filtro vero è
  # nell'`if` del job "analyze", via `github.event.repository.default_branch` — così vale sia
  # per `main` che per `master`. Branch di sessione (claude/**, ecc.) fuori, via pull_request.
  push:
  pull_request:
  schedule:
    # Scansione periodica settimanale
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL — analisi statica di sicurezza (${{ matrix.language }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'push' &&
       (github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'fix/'))) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == github.event.repository.default_branch)
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: csharp
            build-mode: manual
    steps:
      - uses: actions/checkout@v5

      - name: Configura .NET 9
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Inizializza CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build (Release) — solo C#, richiesto da build-mode manual
        if: matrix.language == 'csharp'
        run: dotnet build backend/backend.csproj --configuration Release

      - name: Analisi CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: false
          output: sarif-results

      # Fallisce solo l'upload (non abilitato su repo privati senza Advanced
      # Security), non l'analisi: qui va un warning, non un errore rosso.
      - name: Carica risultati su GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: sarif-results
          category: "/language:${{ matrix.language }}"
