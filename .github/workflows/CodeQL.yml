name: CodeQL

# Analisi statica di sicurezza (SAST) via CodeQL per frontend e backend.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Scansione periodica settimanale
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL — analisi statica di sicurezza (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: csharp
            build-mode: manual
    steps:
      - uses: actions/checkout@v5

      - name: Configura .NET 9
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Inizializza CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build (Release) — solo C#, richiesto da build-mode manual
        if: matrix.language == 'csharp'
        run: dotnet build backend/backend.csproj --configuration Release

      - name: Analisi CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
