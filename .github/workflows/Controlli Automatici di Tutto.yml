name: Controlli Automatici di Tutto

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build e audit pacchetti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configura .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Build (Release)
        run: dotnet build backend/backend.csproj --configuration Release

      - name: Controlla pacchetti vulnerabili
        run: |
          source scripts/lib/gh-summary.sh
          OUTPUT=$(dotnet list backend/backend.csproj package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qw "Critical"; then
            gh_summary_append "### 📦 Pacchetti NuGet vulnerabili
          ❌ Trovata almeno una vulnerabilità CRITICAL

          <details><summary>Dettaglio</summary>

          \`\`\`
          $OUTPUT
          \`\`\`

          </details>"
            echo "::error::Trovati pacchetti NuGet con vulnerabilità CRITICAL. Esegui 'dotnet list package --vulnerable' per i dettagli."
            exit 1
          fi
          gh_summary_append "### 📦 Pacchetti NuGet vulnerabili
          ✅ Nessuna vulnerabilità CRITICAL (High/Moderate/Low non bloccano, vedi log per il dettaglio)"

  frontend:
    name: Frontend — qualità e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installa dipendenze
        working-directory: frontend
        run: npm ci

      - name: Audit di sicurezza
        run: |
          source scripts/lib/gh-summary.sh
          if npm --prefix frontend audit --audit-level=critical --omit=dev; then
            gh_summary_append "### 📦 Pacchetti npm vulnerabili
          ✅ Nessuna vulnerabilità CRITICAL (High/Moderate/Low non bloccano, vedi log per il dettaglio)"
          else
            gh_summary_append "### 📦 Pacchetti npm vulnerabili
          ❌ Trovata almeno una vulnerabilità CRITICAL — dettaglio nel log dello step"
            exit 1
          fi

      - name: Analisi Lint
        run: bash scripts/test/lint-check.sh

      - name: Controllo dei tipi
        run: bash scripts/test/tsc-check.sh

      - name: Dipendenze circolari
        run: bash scripts/test/circular-deps-check.sh

      - name: Genera risorse statiche
        working-directory: frontend
        run: npm run generate:statics

      - name: Verifica seed allineato a global-settings.json
        run: |
          if ! git diff --quiet -- frontend/src/environments/environment.ts; then
            echo "::error file=frontend/src/environments/environment.ts::Seed non allineato a global-settings.json: cambia versione/identità lì, poi 'npm run generate:statics' (cartella frontend) e committa il risultato."
            git --no-pager diff -- frontend/src/environments/environment.ts
            exit 1
          fi

      - name: Invarianti SiteBuilder
        run: bash scripts/test/site-builder-check.sh

      - name: Genera icone
        working-directory: frontend
        run: npm run generate:icons

      - name: Genera tipi da global-settings.schema.json
        working-directory: frontend
        run: npm run generate:types

      - name: Verifica tipi allineati a global-settings.schema.json
        run: |
          if ! git diff --quiet -- frontend/src/app/core/engine/global-settings.types.ts; then
            echo "::error file=frontend/src/app/core/engine/global-settings.types.ts::Tipi non allineati allo schema: cambia global-settings.schema.json, poi 'npm run generate:types' (cartella frontend) e committa il risultato."
            git --no-pager diff -- frontend/src/app/core/engine/global-settings.types.ts
            exit 1
          fi

      - name: Build produzione (ng build)
        working-directory: frontend
        run: npx ng build --configuration production

  i18n:
    name: i18n — completezza traduzioni
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Controlla simmetria chiavi di tutte le lingue
        run: bash scripts/test/i18n-check.sh

  security-scan:
    name: Sicurezza — secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Secret scanning (gitleaks)
        run: |
          source scripts/lib/gh-summary.sh
          GITLEAKS_LOG="$(mktemp)"
          if docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --redact --verbose --config=/repo/.gitleaks.toml 2>&1 | tee "$GITLEAKS_LOG"; then
            gh_summary_append "### 🔐 Secret scanning (gitleaks)
          ✅ Nessun segreto trovato"
          else
            gh_summary_append "### 🔐 Secret scanning (gitleaks)
          ❌ Trovato almeno un segreto — dettaglio redatto nel log dello step

          <details><summary>Dettaglio (redatto)</summary>

          \`\`\`
          $(cat "$GITLEAKS_LOG")
          \`\`\`

          </details>"
            rm -f "$GITLEAKS_LOG"
            exit 1
          fi
          rm -f "$GITLEAKS_LOG"

  live-tests:
    name: Audit live — Pa11y + Lighthouse
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installa dipendenze
        working-directory: frontend
        run: npm ci

      - name: Configura Buildx (driver con supporto cache GitHub Actions)
        uses: docker/setup-buildx-action@v4

      - name: Pre-scalda la cache Docker di frontend/backend
        run: |
          # Build parallela con cache BuildKit
          docker buildx build --file backend/Dockerfile \
            --cache-from "type=gha,scope=backend-live-test" \
            --cache-to   "type=gha,scope=backend-live-test,mode=max" \
            backend &
          backend_pid=$!
          docker buildx build --file frontend/Dockerfile \
            --cache-from "type=gha,scope=frontend-live-test" \
            --cache-to   "type=gha,scope=frontend-live-test,mode=max" \
            frontend &
          frontend_pid=$!

          backend_exit=0; frontend_exit=0
          wait "$backend_pid" || backend_exit=$?
          wait "$frontend_pid" || frontend_exit=$?
          if [[ $backend_exit -ne 0 || $frontend_exit -ne 0 ]]; then
            echo "::error::Pre-scaldamento cache fallito — backend: exit ${backend_exit}, frontend: exit ${frontend_exit}"
            exit 1
          fi

      - name: Build e avvio stack Docker (dietro reverse proxy pubblico)
        run: bash scripts/test/public-test.sh

      - name: Audit live (Pa11y + Lighthouse)
        run: bash scripts/test/live-test.sh http://localhost:8088

      - name: Butta giù
        if: always()
        run: |
          COMPOSE_PROJECT_NAME="$(node --input-type=module --eval "import{readFileSync}from'fs';const s=JSON.parse(readFileSync('global-settings.json','utf-8'));process.stdout.write(String(s.project?.name||'app').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+\$/g,''))")" \
          docker compose -f docker-compose.yml -f docker-compose.public-test.yml down
